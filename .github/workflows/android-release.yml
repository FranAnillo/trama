name: Preparar Android para Google Play
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Código de versión nuevo y mayor que el último enviado a Play
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    env:
      CONTENT_URL: ${{ vars.TRAMA_CONTENT_URL || 'https://trama-informatica.ireperezsant.chatgpt.site/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib tool test
      - run: flutter test --no-pub
      - name: Preparar clave de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAMA_KEYSTORE_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          STORE_PASSWORD: ${{ secrets.TRAMA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAMA_KEY_PASSWORD }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Código de versión inválido'; exit 1; }
          [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || { echo 'Faltan los secretos de firma'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trama-upload.jks"
      - name: Compilar APK y AAB firmados
        env:
          TRAMA_UPLOAD_KEYSTORE: ${{ runner.temp }}/trama-upload.jks
          TRAMA_STORE_PASSWORD: ${{ secrets.TRAMA_STORE_PASSWORD }}
          TRAMA_KEY_ALIAS: ${{ secrets.TRAMA_KEY_ALIAS }}
          TRAMA_KEY_PASSWORD: ${{ secrets.TRAMA_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          flutter build appbundle --release --no-pub --build-number "$BUILD_NUMBER" --dart-define="TRAMA_CONTENT_URL=$CONTENT_URL"
          flutter build apk --release --no-pub --build-number "$BUILD_NUMBER" --dart-define="TRAMA_CONTENT_URL=$CONTENT_URL"
          python3 tool/check_android.py build/app/outputs/bundle/release/app-release.aab
          python3 tool/check_android.py build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: trama-android-release-${{ inputs.build_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/SHA256SUMS
      - name: Eliminar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/trama-upload.jks"
