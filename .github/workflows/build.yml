name: Verificar, compilar y publicar Trama
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trama-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', cache: true}
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib tool test
      - run: flutter test --no-pub --coverage
      - name: Verificar permisos y transacciones de sincronización
        run: |
          docker pull postgres:16-alpine
          python3 tool/check_backend.py
      - uses: actions/upload-artifact@v4
        with: {name: trama-coverage, path: coverage/lcov.info}
  web:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base_path: ${{ steps.path.outputs.base_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', cache: true}
      - run: flutter pub get --enforce-lockfile
      - name: Ruta de GitHub Pages
        id: path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          base="${PAGES_BASE_PATH:-/$REPOSITORY_NAME/}"
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then base=/; fi
          echo "base_path=$base" >> "$GITHUB_OUTPUT"
      - name: Compilar web
        env:
          BASE_PATH: ${{ steps.path.outputs.base_path }}
        run: bash tool/web.sh --base-href "$BASE_PATH"
      - run: python3 tool/check_integrity.py
      - run: python3 -m pip install -r tool/requirements-test.txt
      - name: Recorrido real y prueba offline en Chrome
        env:
          BASE_PATH: ${{ steps.path.outputs.base_path }}
        run: python3 tool/browser_check.py --base-path "$BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with: {path: build/web}
      - uses: actions/upload-artifact@v4
        with: {name: trama-web, path: build/web}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  public-check:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: trama-web, path: build/web}
      - name: Comprobar la versión realmente publicada
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python3 tool/check_integrity.py --url "$PAGES_URL"
  android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.47.9', cache: true}
      - run: flutter pub get --enforce-lockfile
      - name: APK instalable para pruebas
        env:
          CONTENT_URL: ${{ vars.TRAMA_CONTENT_URL || 'https://trama-informatica.ireperezsant.chatgpt.site/' }}
        run: flutter build apk --debug --no-pub --dart-define="TRAMA_CONTENT_URL=$CONTENT_URL"
      - run: python3 tool/check_android.py build/app/outputs/flutter-apk/app-debug.apk
      - name: Huella del APK
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: trama-android-pruebas
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS
